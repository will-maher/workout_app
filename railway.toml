[build]
builder = "nixpacks"

[deploy]
sleepApplication = true
sleepTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Resource limits to control memory usage
[deploy.resources]
memory = "512Mi"
cpu = "0.5"

# Environment variables for optimization
[deploy.variables]
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=400"
