[build]
builder = "nixpacks"

[deploy]
sleepApplication = true
sleepTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Resource limits to control memory usage
[deploy.resources]
memory = "512Mi"  # Start with 512MB, adjust based on actual usage
cpu = "0.5"       # Half a CPU core

# Environment variables for optimization
[deploy.variables]
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=400"  # Limit Node.js heap to 400MB
